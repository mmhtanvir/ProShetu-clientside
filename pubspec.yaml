name: proshetu
description: Offline-first crisis communication platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — compile-safe DI + reactive state, no BuildContext coupling.
  flutter_riverpod: ^3.4.2

  # Declarative routing with guards, redirects, deep links.
  go_router: ^18.0.1

  # Immutable models + unions (used later for domain entities).
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # Networking (configured, never hardcoded).
  dio: ^5.5.0

  # Secure at-rest storage for keys/tokens (Keystore / Keychain).
  flutter_secure_storage: ^11.0.0

  # Assets & media.
  flutter_svg: ^2.0.10
  cached_network_image: ^4.0.0

  # i18n.
  intl: any

  # Native camera/gallery capture (identity verification).
  image_picker: ^1.1.2

  # Real map rendering (dashboard preview + Map tab).
  google_maps_flutter: ^2.9.0

  # Ed25519/X25519 identity, Blake2b content-addressing, AEAD + KDF for
  # local private-key-at-rest encryption (backend integration).
  cryptography: ^2.7.0

  # Device GPS position, needed to pick a coordination geohash shard
  # when publishing/fetching coordination data.
  geolocator: ^14.0.3

  # Live push channel (/ws/push) — event/call wake-up hints.
  # Pinned to 3.x (not 2.x): 2.x pulls in `web ^0.5.0`, which conflicts
  # with geolocator's `web ^1.0.0` requirement — a real version-solve
  # failure, not a style preference.
  web_socket_channel: ^3.0.3

  # Synchronous SHA-256 for the (non-cryptographic) Bloom filter used
  # in /v1/sync reconciliation — deliberately separate from the async
  # `cryptography` package used for the actual identity/AEAD crypto.
  crypto: ^3.0.3

  # Local (not push-service) notifications — used ONLY for new-message
  # hints. See infrastructure/notifications/notification_service.dart:
  # coordination/SOS updates are pull-only by design and never notify.
  flutter_local_notifications: ^22.3.0

  # Background push (FCM) — wakes the app for a new message or an
  # incoming call when no live /ws/push socket is connected (e.g. app
  # backgrounded/killed). firebase_core just loads native config
  # (google-services.json / GoogleService-Info.plist); until those
  # exist for a real Firebase project, Firebase.initializeApp() in
  # main.dart fails gracefully and the app runs exactly as before —
  # see that file's doc comment.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  # Voice note recording/playback in the message composer.
  # record 5.2.x has an upstream bug: its own record_linux and
  # record_platform_interface sub-packages don't resolve to a mutually
  # compatible pair (record_linux is missing methods the interface
  # requires). 6.x fixes this; the AudioRecorder API used in
  # infrastructure/media/voice_recorder.dart is unchanged.
  record: ^6.2.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # QR pairing: generating this device's own code and scanning a
  # peer's to learn their mailbox_id (infrastructure/storage/
  # contact_directory_store.dart) — the out-of-band exchange that
  # class's doc comment says nothing populates yet.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Real-time network state (Wi-Fi / mobile / offline) for the
  # dashboard's Internet status tile.
  connectivity_plus: ^7.3.1

  # Phone-number country code entry: detect the caller's current
  # country from GPS (reverse-geocoded natively, no Maps/Google API
  # key involved) to preselect a dial code, with a picker to change
  # it — used by signup and Add-by-number's phone fields.
  geocoding: ^5.0.0
  country_code_picker: ^3.4.1

  # Real message-history persistence (infrastructure/storage/
  # message_store.dart). Append-heavy, queried by chat+time — the
  # secure-storage "read whole blob, rewrite whole blob" pattern used
  # elsewhere (ContactDirectoryStore, SessionStore) doesn't scale past
  # a few hundred messages, so this is a genuinely separate storage
  # engine, not just more of the same pattern.
  sqflite: ^2.4.3

  # BLE mesh Phase 1 (proximity discovery only, no relay yet — see
  # lib/infrastructure/mesh/README.md): flutter_blue_plus for central
  # (scan/connect), flutter_ble_peripheral for advertising — no single
  # plugin does both roles well cross-platform. permission_handler for
  # the Android 12+ three-way BLUETOOTH_SCAN/ADVERTISE/CONNECT runtime
  # prompt, which nothing else in this app currently needs.
  flutter_blue_plus: ^2.3.11
  flutter_ble_peripheral: ^3.1.0
  permission_handler: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0C"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#0A0A0C"
    theme_color: "#0A0A0C"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
